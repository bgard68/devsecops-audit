name: Lint

# The audit script is the product here, so it gets the same treatment the
# repositories it audits give their own code: a syntax check that fails the
# build, and a linter that catches the shell mistakes which look fine until
# a repository name contains a space.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Shell syntax and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Parse every script
        run: |
          set -euo pipefail
          for f in scripts/*.sh; do
            bash -n "$f"
            echo "ok  $f parses"
          done

      # Pre-installed on the runner, so no action and no extra supply chain.
      # A script committed without its mode bit fails at run time with exit
      # 126, which looks like the script ran and failed rather than never
      # having run at all. Caught here instead.
      - name: Every script is executable
        run: |
          set -euo pipefail
          bad=0
          for f in scripts/*.sh; do
            mode=$(git ls-files -s "$f" | awk '{print $1}')
            if [ "$mode" != "100755" ]; then
              echo "::error title=Not executable::$f is committed as $mode; needs 100755 (git update-index --chmod=+x $f)"
              bad=1
            else
              echo "ok  $f is executable"
            fi
          done
          exit $bad

      # The script's whole value is that a clean run means something, which
      # requires a failing run to exit non-zero. It did not for three commits:
      # the summary line was the last command, and an echo always succeeds, so
      # a failing audit exited 0 and the job reported pass.
      #
      # Shown a target it cannot possibly pass, and required to say so in its
      # exit code. This is the gate-probe pattern applied to the auditor.
      - name: Probe - a failing audit exits non-zero
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          OWNER=bgard68 REPOS="this-repository-does-not-exist"             BRANCHES="this-repository-does-not-exist:main"             bash scripts/audit.sh > /dev/null 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error title=Probe failed::The audit exited 0 against a target it cannot check. A failing audit must fail the job."
            exit 1
          fi
          echo "ok  a failing audit exits $status - non-zero, as it must be"

      - name: shellcheck
        run: |
          set -euo pipefail
          shellcheck --version
          # SC2086 is disabled deliberately: the repo and branch lists are
          # space-separated words that are MEANT to split. Everything else
          # is an error rather than a warning.
          shellcheck --severity=warning --exclude=SC2086 scripts/*.sh
          echo "ok  shellcheck clean"

  workflows:
    name: Workflow YAML
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Every workflow parses
        run: |
          set -euo pipefail
          for f in .github/workflows/*.yml; do
            python3 -c "import yaml,sys;yaml.safe_load(open(sys.argv[1],encoding='utf-8'))" "$f"
            echo "ok  $f parses"
          done

      # This repository audits others for exactly this; failing to hold itself
      # to it would be the most obvious possible omission.
      - name: Every action is pinned to a commit SHA
        run: |
          set -uo pipefail
          bad=$(grep -rhoE "uses: [^ ]+@[^ ]+" .github/workflows/*.yml | grep -vE "@[0-9a-f]{40}" || true)
          if [ -n "$bad" ]; then
            echo "::error title=Unpinned action::An action is pinned to a tag rather than a commit SHA."
            echo "$bad"
            exit 1
          fi
          echo "ok  every action pinned to a SHA"
