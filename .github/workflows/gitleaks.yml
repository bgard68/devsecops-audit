name: Secret scan

# Scans the whole history, not just the tip. A credential deleted in a later
# commit is still in the history and still valid — deleting the file is not
# rotating the secret.
#
# This repository holds no credentials by design, which is exactly why the scan
# matters: the claim is only worth something if something checks it.

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    # Rules improve; a commit that scanned clean last year may not now.
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The whole history, because that is what is being scanned.
          fetch-depth: 0
          # Nothing here pushes, so the job token has no use after the clone.
          persist-credentials: false

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
